<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <h1 class="wordmark">OpenBot</h1>
      <p class="nav-status" id="nav-status">Loading</p>
    </header>

    <main>
      <section id="now" class="now-card" aria-labelledby="now-heading">
        <p class="kicker">Now</p>
        <h2 id="now-heading" class="now-title">Loading…</h2>
        <p class="now-body" id="now-copy"></p>
        <p class="code" id="now-origin" hidden></p>
        <div class="now-actions" id="now-actions"></div>
      </section>

      <section aria-labelledby="providers-heading">
        <h2 id="providers-heading" class="section-title">Providers</h2>
        <div class="list-card">
          <div id="provider-list"></div>
          <details id="add-provider">
            <summary>
              <span>Add provider</span>
              <span class="chevron" aria-hidden="true"></span>
            </summary>
            <div class="panel">
              <p class="hint">
                OpenAI-compatible Base URL, a Model ID, and an API Key. Add more models
                on the provider after you save.
              </p>
              <form id="provider-form">
                <label>
                  Name
                  <input name="name" type="text" required placeholder="OpenAI" autocomplete="off" />
                </label>
                <label>
                  Base URL
                  <input
                    name="origin"
                    type="url"
                    required
                    placeholder="https://api.openai.com/v1"
                    autocomplete="off"
                  />
                </label>
                <label>
                  Model ID
                  <input name="modelSlug" type="text" required placeholder="gpt-4.1" autocomplete="off" />
                </label>
                <label>
                  API Key
                  <span class="password-field">
                    <input
                      name="secret"
                      type="password"
                      required
                      placeholder="sk-…"
                      autocomplete="new-password"
                      id="add-secret"
                    />
                    <button type="button" class="button-tertiary" data-toggle-secret="add-secret">
                      Show
                    </button>
                  </span>
                </label>
                <div class="form-actions">
                  <button type="submit" class="button-primary">Save and use</button>
                  <p class="fine" id="form-note" aria-live="polite"></p>
                </div>
              </form>
            </div>
          </details>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
